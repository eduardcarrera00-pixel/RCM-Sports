<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" role="img" aria-labelledby="aeTitle aeDesc">
<title id="aeTitle">AE SPORTS — A con hoja integrada</title>
<desc id="aeDesc">Monograma señorial de una A caligráfica cuya cúspide se funde con una hoja de bronce.</desc>
<defs>
  <linearGradient id="bronze" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#A16B4B"/><stop offset=".58" stop-color="#D6A47C"/><stop offset="1" stop-color="#F3C69D"/></linearGradient>
  <linearGradient id="leaf" x1="0" y1="1" x2=".9" y2="0"><stop stop-color="#B87B54"/><stop offset="1" stop-color="#E9BB8C"/></linearGradient>
</defs>
<!-- The left sweep forms the A with a quiet calligraphic serif. -->
<path d="M12 94C25 76 34 46 51 17c2-4 6-5 9-1l6 10" fill="none" stroke="url(#bronze)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M44 49 25 94" fill="none" stroke="url(#bronze)" stroke-width="4.5" stroke-linecap="round"/>
<!-- Contrasting right stroke: tapered and slightly curved instead of geometric. -->
<path d="M58 29c8 21 19 49 32 64" fill="none" stroke="url(#bronze)" stroke-width="8" stroke-linecap="round"/>
<path d="M34 71c12-3 25-4 40-4" fill="none" stroke="#C99872" stroke-width="5.5" stroke-linecap="round"/>
<!-- The leaf grows from the upper stroke rather than sitting beside it. -->
<path d="M56 31C64 13 81 6 104 8c-2 20-16 34-39 36-4-3-7-7-9-13Z" fill="url(#leaf)"/>
<path d="M56 42C70 29 84 20 101 10" fill="none" stroke="#754E3E" stroke-width="2.3" stroke-linecap="round"/>
<path d="M72 29 74 16M82 22l11 1M63 37l2-10" fill="none" stroke="#95684E" stroke-width="1.5" stroke-linecap="round"/>
</svg>