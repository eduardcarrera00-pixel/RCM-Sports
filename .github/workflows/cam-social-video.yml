name: CAM Sports Instagram and TikTok audio videos

on:
  push:
    branches: [main]
    paths:
      - 'scripts/cam_social_make_video.py'
      - 'supabase/migrations/*cam_pick_photo_parlay_video.sql'
      - '.github/workflows/cam-social-video.yml'
  schedule:
    # GitHub cron has a five-minute minimum and may run late.
    - cron: '2/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cam-tiktok-original-music
  cancel-in-progress: false

jobs:
  make-public-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Check whether any social videos are pending
        id: waiting
        run: |
          response=$(curl --fail-with-body --silent --show-error --retry 3 \
            -X POST 'https://zahuhmvmqvxaunqebqaa.supabase.co/rest/v1/rpc/cam_social_video_jobs' \
            -H 'apikey: sb_publishable_QK4qV6totowE4KjolNANrQ_O46olHYg' \
            -H 'Content-Type: application/json' -d '{"max_jobs":1}')
          echo "$response" | jq -e 'type == "array"' >/dev/null
          count=$(echo "$response" | jq 'length')
          echo "pending=$count" >> "$GITHUB_OUTPUT"
          echo "Waiting Instagram/TikTok videos: $count"
      - uses: actions/setup-python@v5
        if: steps.waiting.outputs.pending != '0'
        with:
          python-version: '3.12'
      - name: Install renderer
        if: steps.waiting.outputs.pending != '0'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null ||
             ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ||
             ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ||
             ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf; then
            sudo timeout 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
            sudo timeout 180s apt-get -y -qq install ffmpeg fonts-dejavu-core
          fi
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Verify audio and MP4 generation
        if: steps.waiting.outputs.pending != '0'
        run: python scripts/cam_social_make_video.py --smoke-test
      - name: Render public editorial jobs waiting for Instagram or TikTok
        if: steps.waiting.outputs.pending != '0'
        run: python scripts/cam_social_make_video.py
      - name: Save MP4s for the CAM Sports publisher
        if: steps.waiting.outputs.pending != '0'
        run: |
          if [[ -z "$(git status --porcelain -- assets/social-videos/)" ]]; then
            echo "No new videos."
            exit 0
          fi
          git config user.name "CAM Sports media bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social-videos/
          git commit -m "media: generate original music videos for Instagram and TikTok [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
