name: CAM SPORTS on-demand admin editor performance

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/cam-admin-news-editor-loader.js'
      - 'assets/ae-news-editor.js'
      - 'tests/admin-news-editor-lazy-browser.cjs'
      - 'package.json'
      - '.github/workflows/cam-admin-editor-performance.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/cam-admin-news-editor-loader.js'
      - 'assets/ae-news-editor.js'
      - 'tests/admin-news-editor-lazy-browser.cjs'
      - 'package.json'
      - '.github/workflows/cam-admin-editor-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lazy-admin-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check assets/cam-admin-news-editor-loader.js
      - run: npx playwright install --with-deps chromium
      - name: Admin editor deferred, retryable and unchanged
        run: npm run test:perf:admin && npm run test:editor && npm run test:auth
