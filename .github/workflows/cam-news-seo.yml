name: CAM SPORTS public news metadata
on:
  schedule:
    # Refresh only public article metadata; GitHub may delay scheduled jobs.
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'assets/cam-article-seo.js'
      - 'scripts/build-news-seo.mjs'
      - '.github/workflows/cam-news-seo.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cam-news-seo
  cancel-in-progress: false
jobs:
  public-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh metadata of published articles
        run: node scripts/build-news-seo.mjs
      - name: Save generated previews for the existing CAM publisher
        run: |
          if [[ -z "$(git status --porcelain -- compartir/noticias assets/cam-article-previews.json sitemap.xml robots.txt)" ]]; then
            echo "Public news metadata is current."
            exit 0
          fi
          git config user.name "CAM Sports news bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compartir/noticias assets/cam-article-previews.json sitemap.xml robots.txt
          git commit -m "seo: refresh public news sharing previews [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
