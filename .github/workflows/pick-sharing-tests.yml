name: Pick sharing checks

on:
  pull_request:
    paths:
      - 'assets/cam-pick-share.*'
      - 'assets/community-picks.js'
      - 'assets/ae-profile.js'
      - 'assets/ae-editorial-weekly.js'
      - 'assets/style-sources.json'
      - 'index.html'
      - 'tests/pick-sharing*'
      - 'tests/profile-sharing.mjs'
      - 'package*.json'
      - '.github/workflows/pick-sharing-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sharing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify sharing and community/profile integration
        run: npm run test:sharing && npm run test:picks && node tests/profile-compose.mjs
      - name: Verify PNG, mobile layouts and native share activation
        run: npm run test:sharing:browser
      - name: Verify Take export with the WebKit engine and iPhone viewport
        run: CAM_SHARE_BROWSER=webkit node tests/pick-sharing-takes-browser.cjs
