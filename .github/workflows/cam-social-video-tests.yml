name: Social licensed music rotation checks

on:
  pull_request:
    paths:
      - 'scripts/cam_social_make_video.py'
      - 'supabase/20_cam_social_tiktok_music.sql'
      - 'supabase/21_cam_social_tiktok_mime_fallback.sql'
      - 'tests/social-video-publication.mjs'
      - 'tests/social-instagram-publication.mjs'
      - 'tests/social-music-rotation.mjs'
      - 'tests/ready-pick-social-videos.mjs'
      - 'assets/social-videos/pick-template-*.json'
      - 'supabase/migrations/*cam_pick_ready_social_videos.sql'
      - 'supabase/migrations/*cam_social_rotating_cc0_music.sql'
      - 'supabase/migrations/*cam_instagram_music_publication.sql'
      - '.github/workflows/cam-social-video*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null ||
             ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ||
             ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ||
             ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf; then
            sudo timeout 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
            sudo timeout 180s apt-get -y -qq install ffmpeg fonts-dejavu-core
          fi
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Verify video routing, photo X channel, and retries
        run: node tests/social-video-publication.mjs && node tests/social-instagram-publication.mjs && node tests/social-music-rotation.mjs
      - name: Verify ready Pick media, delivery guards and private access
        run: node tests/ready-pick-social-videos.mjs
      - name: Verify licensed music is required and audio embedded in MP4
        run: python scripts/cam_social_make_video.py --smoke-test
