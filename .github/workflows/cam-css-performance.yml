name: CAM SPORTS CSS performance and regressions

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**/*.css'
      - 'assets/performance-css-packs.json'
      - 'scripts/build-performance-css.mjs'
      - 'tests/performance-css.mjs'
      - 'tests/opinions-section-banners.mjs'
      - 'package.json'
      - '.github/workflows/cam-css-performance.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**/*.css'
      - 'assets/performance-css-packs.json'
      - 'scripts/build-performance-css.mjs'
      - 'tests/performance-css.mjs'
      - 'package.json'
      - '.github/workflows/cam-css-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  css-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check compiled pack integrity and stylesheet order
        run: npm run test:performance
      - name: Verify Picks, mobile navigation, banners and account UX
        run: npm run test:picks && npm run test:mobile-nav && npm run test:opinions-banners && npm run test:site-banners && npm run test:auth
