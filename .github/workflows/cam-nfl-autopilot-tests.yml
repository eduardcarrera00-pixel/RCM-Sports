name: CAM NFL Autopilot checks
on:
  pull_request:
    paths:
      - 'supabase/functions/cam-nfl-auto/**'
      - 'supabase/migrations/*cam_nfl*'
      - 'assets/cam-nfl-quiniela.js'
      - 'docs/nfl-quiniela-autopilot.md'
      - '.github/workflows/cam-nfl-autopilot-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate frontend JavaScript
        run: node --check assets/cam-nfl-quiniela.js
      - name: Validate SportsDataIO worker TypeScript
        run: deno check supabase/functions/cam-nfl-auto/index.ts
