name: CAM SPORTS Sport banner independence

on:
  pull_request:
    paths:
      - 'assets/ae-site-images.js'
      - 'tests/site-sport-banner-images.mjs'
      - 'package.json'
      - '.github/workflows/site-sport-banner-images.yml'
  push:
    branches: [main]
    paths:
      - 'assets/ae-site-images.js'
      - 'tests/site-sport-banner-images.mjs'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify four independent sport banners
        run: npm run test:site-banners
