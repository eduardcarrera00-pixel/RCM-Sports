name: Weekly Pick results
on:
  pull_request:
    paths:
      - 'assets/cam-weekly-results.js'
      - 'assets/ae-editorial-weekly.js'
      - 'tests/weekly-results-ui.mjs'
      - 'supabase/20_cam_weekly_results.sql'
      - '.github/workflows/weekly-results.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check assets/cam-weekly-results.js && node --check assets/ae-editorial-weekly.js
      - run: node tests/weekly-results-ui.mjs
      - run: node tests/social-publication.mjs
      - run: npm run test:editor
