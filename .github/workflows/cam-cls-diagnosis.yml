name: CAM SPORTS CLS diagnosis (first visit)
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/diagnose-layout-shifts.cjs'
      - 'tests/home-first-load-stability.mjs'
      - '.github/workflows/cam-cls-diagnosis.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose-layout-shifts.cjs'
      - 'tests/home-first-load-stability.mjs'
      - '.github/workflows/cam-cls-diagnosis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace-shifts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prevent false empty-news screen during first fetch
        run: node tests/home-first-load-stability.mjs
      - run: npx playwright install --with-deps chromium
      - name: Trace CLS shifts in cold mobile and desktop visits
        run: node scripts/diagnose-layout-shifts.cjs
      - name: Preserve Picks, auth, navigation and editorial views
        run: npm run test:picks && npm run test:auth && npm run test:mobile-nav && npm run test:opinions-banners && npm run test:site-banners && npm run test:perf:editorial
