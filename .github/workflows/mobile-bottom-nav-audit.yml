name: CAM SPORTS mobile bottom navigation audit
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/mobile-bottom-navigation-audit.cjs'
      - '.github/workflows/mobile-bottom-nav-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bottom-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check tests/mobile-bottom-navigation-audit.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/mobile-bottom-navigation-audit.cjs
      - name: Evidence (day/night screenshots and JSON report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cam-mobile-bottom-nav-evidence
          path: test-results/mobile-bottom-nav
          retention-days: 14
          if-no-files-found: warn
