name: CAM SPORTS regenerate duplicate-free editorial CSS
on:
  push:
    branches: [perf/remove-duplicate-editorial-css-20261024]
    paths:
      - assets/style-sources.json
      - .github/workflows/generate-editorial-css-cleanup.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/perf/remove-duplicate-editorial-css-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/remove-duplicate-editorial-css-20261024
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Regenerate from canonical source list
        run: node scripts/build-editorial-css.mjs
      - name: Commit generated editorial bundle to this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ae-editorial-bundle.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "css: regenerate editorial bundle without later-duplicated rules [skip ci]"
          git push origin HEAD:perf/remove-duplicate-editorial-css-20261024
