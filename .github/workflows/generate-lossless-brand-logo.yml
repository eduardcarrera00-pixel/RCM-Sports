name: CAM SPORTS generate lossless brand asset

on:
  push:
    branches:
      - perf/lossless-brand-logo-20261024
    paths:
      - '.github/workflows/generate-lossless-brand-logo.yml'
      - 'scripts/build-lossless-brand-logo.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/perf/lossless-brand-logo-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/lossless-brand-logo-20261024
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow image codec
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate image and verify exact pixel transparency
        run: python scripts/build-lossless-brand-logo.py
      - name: Commit only the generated binary on the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cam-sports-logo-completo.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: lossless CAM brand logo WebP generated from original PNG [skip ci]"
          git push origin HEAD:perf/lossless-brand-logo-20261024
