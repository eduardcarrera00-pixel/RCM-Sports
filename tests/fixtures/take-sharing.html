<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Takes · prueba aislada</title>
<link rel="stylesheet" href="../../assets/site.css"><link rel="stylesheet" href="../../assets/ae-editorial-bundle.css"><link rel="stylesheet" href="../../assets/ae-take-discussion-reference.css"><link rel="stylesheet" href="../../assets/cam-football-last-takes-feed.css">
<style>body{margin:0;padding:24px;background:#eeeae3;color:#273b49;font:15px system-ui}html.dark body{background:#081724;color:#f4e8db}#qaControls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}#qaControls button{padding:12px;border:1px solid;border-radius:12px}#freeTakesFeed{max-width:720px}#aeTakeDiscussion .ae-discussion-titleblock{min-width:0}</style></head><body class="ae-is-football"><div id="qaControls"><button id="qaOpenDetail">Abrir detalle</button><button id="qaTheme">Cambiar tema</button></div><p id="qaNativeResult" role="status"></p>
<main id="mainContent"><section id="freeTakes" class="ae-free-takes" data-sport="football"><h2 id="freeTakesTitle">Takes</h2><p id="freeTakesStatus"></p><h3 id="aeTakesFeedHeading"></h3><div id="freeTakesFeed"></div><select id="freeTakesSort" hidden><option value="new">Nuevo</option></select><select id="freeTakesSportFilter" hidden><option value="all">Todos</option></select><div id="freeTakesFilterWrap" hidden></div><div id="aeNflFeedFilterWrap" hidden></div><select id="aeNflFeedDivision" hidden></select><button id="freeTakesMore" hidden></button></section></main>
<script>
window.currentCategory='Fútbol';window.qaWrites=[];window.qaDraws=[];window.qaLogos=[];window.qaShares=[];
window.qaTake=Object.freeze({id:'00000000-0000-0000-0000-000000000972',author_id:'00000000-0000-0000-0000-000000000951',author:'EduardCarrera',sport:'football',competition:'Fútbol',created_at:'2026-10-23T14:15:00Z',title:'Lamine Yamal, Balón de Oro 2026',body:'Su desequilibrio, su visión y su capacidad para decidir los partidos grandes pueden marcar la diferencia esta temporada.',upvotes:12,downvotes:3});
window.db={auth:{getUser:async()=>({data:{user:null}}),onAuthStateChange(){}},rpc:async(name,args)=>{if(/post|vote|hide/.test(name)&&name!=='ae_take_reply_vote_totals')qaWrites.push(name);return {data:name==='ae_public_take_feed'?[qaTake]:[],error:null};}};
const fill=CanvasRenderingContext2D.prototype.fillText,draw=CanvasRenderingContext2D.prototype.drawImage;
CanvasRenderingContext2D.prototype.fillText=function(text,x,y,...args){const m=this.measureText(text);qaDraws.push({text,x,y,width:m.width,right:this.textAlign==='right',font:this.font,size:parseFloat(this.font.match(/[\d.]+px/)[0])});return fill.call(this,text,x,y,...args);};
CanvasRenderingContext2D.prototype.drawImage=function(img,...args){qaLogos.push({src:img.src,complete:img.complete,width:img.naturalWidth,args});return draw.call(this,img,...args);};
Object.defineProperty(navigator,'canShare',{configurable:true,value:()=>true});Object.defineProperty(navigator,'share',{configurable:true,value:data=>{const active=navigator.userActivation.isActive;qaShares.push({data,active});return Promise.all([data.files[0].arrayBuffer(),fetch(document.querySelector('.cam-pick-share-preview img').src).then(r=>r.arrayBuffer())]).then(([file,preview])=>{const same=String(new Uint8Array(file))===String(new Uint8Array(preview));document.getElementById('qaNativeResult').textContent=(same&&active?'PASS':'FAIL')+' · Menú nativo simulado: PNG idéntico a la vista previa, activación del clic '+active+'.';});}});
</script><script src="../../assets/cam-pick-share.js"></script><script src="../../assets/ae-take-replies.js"></script><script src="../../assets/free-takes.js"></script>
<script>document.getElementById('qaOpenDetail').onclick=()=>aeTakeReplies.open(qaTake);document.getElementById('qaTheme').onclick=()=>document.documentElement.classList.toggle('dark');</script>
</body></html>
